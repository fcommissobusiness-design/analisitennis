name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Astro
        run: npm run build

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "::error::SECRET_CHECK :: token_len=${#CLOUDFLARE_API_TOKEN} account_len=${#CLOUDFLARE_ACCOUNT_ID}"
          OUT=$(npx --yes wrangler@3 pages deploy dist --project-name=analisitennis --branch=main 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            MSG=$(echo "$OUT" | grep -iE "error|not found|auth|token|permission|project|code:|6[0-9]{3}|8[0-9]{6}" | tail -6 | tr '\n' ' | ' | sed 's/%/%25/g')
            [ -z "$MSG" ] && MSG=$(echo "$OUT" | tail -6 | tr '\n' ' | ' | sed 's/%/%25/g')
            echo "::error::WRANGLER_FAIL :: $MSG"
            exit 1
          fi
